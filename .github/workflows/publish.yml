name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  verify-version:
    name: Verify Git tag matches pubspec.yaml
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Check package version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          package_version="$(sed -nE 's/^version:[[:space:]]*([^[:space:]#]+).*$/\1/p' pubspec.yaml)"
          if [[ -z "$package_version" || "$RELEASE_TAG" != "v$package_version" ]]; then
            echo "::error::Tag $RELEASE_TAG must match pubspec.yaml version v$package_version."
            exit 1
          fi

  ci:
    name: Full Dart validation
    needs: verify-version
    uses: ./.github/workflows/ci.yml

  security:
    name: Security validation
    needs: verify-version
    uses: ./.github/workflows/security-hardening.yml

  publish:
    name: Publish only after all checks pass
    needs: [ci, security]
    permissions:
      contents: read
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@6afc89df92d6eb3834022f73cd65adc8cdfcb92d
